name: Apply index.html Turnstile patch

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/spam-leads-form-debug-1tq9z7
      - name: Apply patch, clean up, push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git apply --index .github/patches/index-turnstile.patch
          git rm -q .github/patches/index-turnstile.patch .github/workflows/apply-index-patch.yml
          git commit -F - <<'MSG'
          Gate lead-form submit buttons on a live Turnstile token

          Client-side half of the spam fix: disable the submit button
          ("Verifying you're human...") until the Turnstile callback delivers
          a token, re-disable on expiry/error, and guard both submit handlers
          so a token-less submit cannot fire and show a false success message
          for a lead the server now hard-blocks.

          Applied from .github/patches/index-turnstile.patch by a one-shot
          workflow; both transient files are removed in this same commit.

          Co-Authored-By: Claude Fable 5 <noreply@anthropic.com>
          Claude-Session: https://claude.ai/code/session_01PrC3iuwPt4kbK2srbnwqpd
          MSG
          git push origin HEAD:claude/spam-leads-form-debug-1tq9z7
